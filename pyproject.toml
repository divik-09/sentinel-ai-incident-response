[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-incident-response"
version = "2.0.0"
description = "Evidence-grounded incident investigation with policy-gated sandbox remediation and a tamper-evident audit log"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sentinel Contributors"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning", "ignore::starlette.testclient.StarletteDeprecationWarning"]

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",   # asserts are fine in tests; app code does not use them for control flow
  "S608",   # f-string SQL: every interpolated fragment is an allowlisted column name or placeholder list (see db.py)
  "RUF012", "B008", "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "RUF"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.11"
packages = ["backend"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
