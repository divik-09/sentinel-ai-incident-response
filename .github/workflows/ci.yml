name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests with coverage gate
        run: python -m pytest --cov --cov-report=term-missing
      - name: Evaluation regression gate
        run: python scripts/run_evaluation.py --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentinel:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name sentinel -p 8000:8000 sentinel:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/ready && break || sleep 1; done
          ./scripts/smoke_test.sh http://127.0.0.1:8000
      - name: Container refuses to start in production without credentials
        run: |
          if docker run --rm -e SENTINEL_ENV=production sentinel:ci 2>&1 | grep -q "without authentication"; then echo "ok"; else echo "expected a startup refusal"; exit 1; fi
